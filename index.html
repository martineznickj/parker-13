<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b0b12">
<title>Parker · 13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <!-- PHASE 1 — title -->
  <section id="title" class="phase active">
    <div class="title-inner">
      <div class="title-eyebrow">A decade of memories</div>
      <h1 class="title-name">Parker</h1>
      <div class="title-thirteen">13</div>
      <div class="title-rule"></div>
      <div class="title-date">2016 &mdash; 2026</div>
      <button id="beginBtn" class="begin-btn">
        <span class="begin-label">Begin</span>
        <span class="begin-play">▶</span>
      </button>
    </div>
  </section>

  <!-- PHASE 2/3 — memory wall -->
  <section id="wall" class="phase">
    <div id="wallCanvas"></div>
  </section>

  <!-- PHASE 4 — cinematic -->
  <section id="cinema" class="phase">
    <div id="cinA" class="cinema-layer"></div>
    <div id="cinB" class="cinema-layer"></div>
  </section>

  <!-- video moment -->
  <section id="videoMoment" class="phase">
    <video id="singingVideo" playsinline preload="auto" muted></video>
  </section>

  <!-- PHASE 5 — finale -->
  <section id="finale" class="phase">
    <div class="stars" aria-hidden="true"></div>
    <div class="moon" aria-hidden="true"></div>
    <div class="finale-inner">
      <h2 class="finale-msg">Happy 13th birthday<br>Parker<span class="bang">!!!</span></h2>
      <div class="finale-sub">Love you to the moon and back.</div>
    </div>
    <button id="replayBtn" class="begin-btn subtle">
      <span class="begin-label">Watch again</span>
      <span class="begin-play">↻</span>
    </button>
  </section>

  <audio id="musicA" loop preload="auto"></audio>
  <audio id="musicB" loop preload="auto"></audio>

<script src="main.js"></script>
</body>
</html>
